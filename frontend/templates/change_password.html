{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="blob b1" style="top:10%;left:5%;right:auto"></div><div class="blob b2" style="bottom:5%;right:5%;left:auto"></div>
  <div class="card auth-card" data-reveal="zoom">
    <span class="eyebrow">{{ icon('key') }} Bảo mật tài khoản</span>
    <h2 class="mt-2">Đổi mật khẩu</h2>
    <p class="muted">Cập nhật mật khẩu mới cho tài khoản @{{ current_user.username }}.</p>
    <form method="post" class="mt-3">{{ csrf() }}
      <div class="field">
        <label for="old_password">Mật khẩu hiện tại *</label>
        <input id="old_password" name="old_password" type="password" class="input" required autocomplete="current-password" autofocus>
      </div>
      <div class="field">
        <label for="new_password">Mật khẩu mới * (tối thiểu 6 ký tự)</label>
        <input id="new_password" name="new_password" type="password" minlength="6" class="input" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm">Xác nhận mật khẩu mới *</label>
        <input id="confirm" name="confirm" type="password" minlength="6" class="input" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-lg btn-block mt-3">Cập nhật mật khẩu {{ icon('arrow') }}</button>
    </form>
    <p class="center muted mt-3 small"><a href="{{ url_for('main.index') }}">Quay lại trang chủ</a></p>
  </div>
</div>
{% endblock %}
