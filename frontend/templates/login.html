{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="blob b1" style="top:10%;left:5%;right:auto"></div><div class="blob b2" style="bottom:5%;right:5%;left:auto"></div>
  <div class="card auth-card" data-reveal="zoom">
    <span class="eyebrow">{{ icon('shield') }} Cổng độc giả</span>
    <h2 class="mt-2">Chào mừng trở lại 👋</h2>
    <p class="muted">Đăng nhập để mượn sách và theo dõi hạn trả.</p>
    <form method="post">{{ csrf() }}
      <div class="field"><label for="u">Tên đăng nhập</label><input id="u" name="username" class="input" required autofocus autocomplete="username"></div>
      <div class="field"><label for="p">Mật khẩu</label><input id="p" name="password" type="password" class="input" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg btn-block">Đăng nhập {{ icon('arrow') }}</button>
    </form>
    <p class="center muted mt-3 small">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}"><b>Đăng ký ngay</b></a></p>
  </div>
</div>
{% endblock %}
