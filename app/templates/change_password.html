{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="blob b1" style="top:10%;left:5%;right:auto"></div><div class="blob b2" style="bottom:5%;right:5%;left:auto"></div>
  <div class="card auth-card" data-reveal="zoom">
    <span class="eyebrow">{{ icon('shield') }} Bảo mật tài khoản</span>
    <h2 class="mt-2">Đổi mật khẩu</h2>
    <p class="muted">Cập nhật mật khẩu mới cho tài khoản <b>@{{ current_user.username }}</b>.</p>
    <form method="post">{{ csrf() }}
      <div class="field">
        <label for="old_p">Mật khẩu hiện tại *</label>
        <input id="old_p" name="old_password" type="password" class="input" required autofocus autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new_p">Mật khẩu mới * (tối thiểu 6 ký tự)</label>
        <input id="new_p" name="new_password" type="password" minlength="6" maxlength="128" class="input" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="conf_p">Nhập lại mật khẩu mới *</label>
        <input id="conf_p" name="confirm" type="password" minlength="6" maxlength="128" class="input" required autocomplete="new-password">
      </div>
      <div class="flex gap-1 mt-2">
        <button class="btn btn-primary btn-block">Lưu thay đổi {{ icon('check') }}</button>
      </div>
    </form>
    <div class="center mt-3 small">
      <a class="muted" href="{{ url_for('admin.dashboard' if current_user.is_admin else 'main.index') }}">Quay lại</a>
    </div>
  </div>
</div>
{% endblock %}
