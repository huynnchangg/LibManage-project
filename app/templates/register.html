{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card wide" data-reveal="zoom">
    <span class="eyebrow-tag">{{ icon('user') }} Độc giả mới</span>
    <h2 class="mt-2">Tạo tài khoản thư viện</h2>
    <p class="muted">Chỉ mất một phút để bắt đầu mượn sách.</p>
    <form method="post">{{ csrf() }}
      <div class="form-grid">
        <div class="field col-6"><label>Họ và tên *</label><input name="full_name" class="input" required value="{{ request.form.full_name }}"></div>
        <div class="field col-6"><label>Mã sinh viên</label><input name="student_code" class="input" value="{{ request.form.student_code }}"></div>
        <div class="field col-6"><label>Tên đăng nhập *</label><input name="username" class="input" required autocomplete="username" value="{{ request.form.username }}"></div>
        <div class="field col-6"><label>Email *</label><input name="email" type="email" class="input" required value="{{ request.form.email }}"></div>
        <div class="field col-6"><label>Mật khẩu * (tối thiểu 6 ký tự)</label><input name="password" type="password" minlength="6" class="input" required autocomplete="new-password"></div>
        <div class="field col-6"><label>Nhập lại mật khẩu *</label><input name="confirm" type="password" class="input" required autocomplete="new-password"></div>
      </div>
      <button class="btn btn-primary btn-lg btn-block">Tạo tài khoản {{ icon('arrow') }}</button>
    </form>
    <p class="center muted mt-3 small">Đã có tài khoản? <a href="{{ url_for('auth.login') }}"><b>Đăng nhập</b></a></p>
  </div>
</div>
{% endblock %}
