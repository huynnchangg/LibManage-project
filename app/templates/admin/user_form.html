{% extends "admin/_layout.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Thêm độc giả mới{% endblock %}
{% block admin_content %}
<div class="page-head" data-reveal>
  <div>
    <span class="eyebrow">
      <a href="{{ url_for('admin.users') }}">{{ icon('users') }} Quản lý độc giả</a> /
    </span>
    <h1 class="mt-1">Tạo hồ sơ độc giả mới</h1>
  </div>
</div>

<form method="post" class="card card-pad" data-reveal style="max-width:680px">
  {{ csrf() }}
  <div class="form-grid">
    <div class="field col-6">
      <label>Tên đăng nhập (Username) *</label>
      <input name="username" class="input" required placeholder="Ví dụ: reader19" autocomplete="off">
    </div>
    <div class="field col-6">
      <label>Mã sinh viên *</label>
      <input name="student_code" class="input" placeholder="Ví dụ: 11210019">
    </div>

    <div class="field col-12">
      <label>Họ và tên độc giả *</label>
      <input name="full_name" class="input" required placeholder="Ví dụ: Nguyễn Hoàng Nam">
    </div>

    <div class="field col-6">
      <label>Địa chỉ Email *</label>
      <input name="email" type="email" class="input" required placeholder="nam.nh@neu.edu.vn">
    </div>
    <div class="field col-6">
      <label>Mật khẩu khởi tạo *</label>
      <input name="password" type="password" class="input" required value="reader123">
      <small class="muted">Mặc định: reader123 (Độc giả có thể đổi sau)</small>
    </div>
  </div>

  <div class="flex gap-1 mt-4">
    <button class="btn btn-primary">{{ icon('check') }} Tạo tài khoản độc giả</button>
    <a class="btn btn-ghost" href="{{ url_for('admin.users') }}">Huỷ bỏ</a>
  </div>
</form>
{% endblock %}
